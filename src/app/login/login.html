<div class="container">
  <!-- Login Form -->
  <div class="form-box login">
    <form action="#">
      <h1>Login</h1>
      <div class="input-box">
        <input type="text" placeholder="Username" required>
        <i class="fa-solid fa-user"></i>
      </div>
      <div class="input-box">
        <input type="password" placeholder="Password" required>
        <i class="fa-solid fa-lock"></i>
      </div>
      <div class="forget-link">
        <a href="#">Forget Password?</a>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
  </div>

  <!-- Register Form -->
  <div class="form-box register">
    <form action="#">
      <h1>Registration</h1>
      <div class="input-box">
        <input type="text" placeholder="Username" required>
        <i class="fa-solid fa-user"></i>
      </div>
      <div class="input-box">
        <input type="email" placeholder="Email" required>
        <i class="fa-solid fa-envelope"></i>
      </div>
      <div class="input-box">
        <input type="password" placeholder="Password" required>
        <i class="fa-solid fa-lock"></i>
      </div>
      <button type="submit" class="btn">Register</button>
    </form>

    <!-- Toggle Box -->
    <div class="toggle-box"></div>
    <!-- Toggle Box Left -->
    <div class="toggle-pannel toggle-left">
      <h1>Hello, Welcome</h1>
      <p>Don't have an account?</p>
      <button type="button" class="btn-register-btn">Register</button>
    </div>

    <!-- Toggle Box Right -->
    <div class="toggle-pannel toggle-right">
      <h1>Welcome Back</h1>
      <p>Already have an account?</p>
      <button type="button" class="btn-login-btn">Login</button>
    </div>
  </div>
</div>
