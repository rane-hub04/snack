<section class="login-shell">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">🥃</div>
      <div>
        <p class="eyebrow">Snack Bar Login</p>
        <h1>LOG IN.</h1>
      </div>
    </div>

    <p class="subtitle">
      Entrer les informations d'identification de votre compte pour accéder à l'application Snack Bar.
    </p>

    <form class="login-form" (ngSubmit)="login()" novalidate>
      <label>
        <span>Username</span>
        <input
          name="username"
          [(ngModel)]="username"
          placeholder="Entrer votre nom d'utilisateur"
          required
          autocomplete="username"
          autofocus
        />
      </label>

      <label>
        <span>Password</span>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </label>

      <label class="checkbox-row">
        <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" />
        <span>Keep me signed in</span>
      </label>

      <button type="button" (click)="login()" [disabled]="!username || !password">Log in</button>
    </form>

    <div class="message error" *ngIf="error">{{ error }}</div>
    <div class="message success" *ngIf="success">{{ success }}</div>
  </div>
</section>
