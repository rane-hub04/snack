<div class="flex flex-col md:flex-row md:items-center md:justify-between p-4 bg-primary text-white shadow-md">
  <!-- Logo + titre -->
  <div class="flex items-center space-x-3 mb-4 md:mb-0">
    <img src="assets/logo.png" alt="Logo" class="h-8 w-8">
    <span class="text-xl font-bold">BarOS POS</span>
  </div>

  <!-- Actions droite -->
  <div class="flex items-center space-x-4">
    <!-- Notifications -->
    <div class="relative">
      <button
        type="button"
        icon="pi-bell"
        class="p-2 text-white hover:bg-primary-dark"
        pButton
        (click)="sidebarVisible = true"
      ></button>
      <span *ngIf="nonLues() > 0" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">
        {{ nonLues() }}
      </span>
    </div>

    <!-- Menu utilisateur -->
    <div class="relative">
      <button
        type="button"
        icon="pi-user"
        class="p-2 text-white hover:bg-primary-dark"
        pButton
        (click)="userMenuVisible = true"
      ></button>
    </div>
  </div>
</div>

<!-- Drawer des notifications -->
<p-drawer [(visible)]="sidebarVisible" position="right" [fullScreen]="true" (onHide)="sidebarVisible = false">
  <ng-template pTemplate="header">
    <h5>Notifications</h5>
  </ng-template>
  <ng-template pTemplate="content">
    <div class="p-4 space-y-3" *ngIf="alertes().length > 0; else loading">
      <div *ngFor="let alerte of alertes()" class="p-3 border rounded hover:bg-gray-50">
        <div class="flex items-start space-x-3">
          <div class="flex-shrink-0 mt-0.5">
            <i class="pi pi-exclamation-triangle text-orange-500 text-xl"></i>
          </div>
          <div>
            <p class="font-medium text-gray-800">{{ getAlertTitle(alerte) }}</p>
            <p class="text-sm text-gray-600">{{ alerte.message }}</p>
            <p class="text-xs text-gray-500">{{ alerte.created_at | date:'short' }}</p>
          </div>
        </div>
        <button
          type="button"
          icon="pi-check"
          class="mt-2 p-button-text text-sm"
          pButton
          (click)="marquerCommeLue(alerte.id)"
        >
          Marquer comme lue
        </button>
      </div>
    </div>
    <ng-template #loading>
      <p class="text-center py-8">Chargement des notifications...</p>
    </ng-template>
  </ng-template>
  <ng-template pTemplate="footer">
    <button
      type="button"
      label="Voir toutes"
      icon="pi-times"
      class="w-full"
      pButton
      (click)="sidebarVisible = false"
    ></button>
  </ng-template>
</p-drawer>

<!-- Menu utilisateur déroulant -->
<div class="fixed right-4 top-16 z-50 w-48" *ngIf="userMenuVisible">
  <div class="bg-white rounded-lg shadow-lg border border-gray-200">
    <div class="px-4 py-3">
      <p class="text-sm font-medium">{{ auth.profile()?.prenom }} {{ auth.profile()?.nom }}</p>
      <p class="text-xs text-gray-500">{{ auth.role() }}</p>
    </div>
    <div class="border-t border-gray-200">
      <nav class="py-1">
        <a
          routerLink="/profile"
          routerLinkActive="active"
          [class.active]="isActiveRoute('/profile')"
          class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
        >
          Mon profil
        </a>
        <a
          (click)="logout()"
          routerLinkActive="active"
          [class.active]="isActiveRoute('/login')"
          class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"
        >
          Déconnexion
        </a>
      </nav>
    </div>
  </div>
</div>
